name: Deploy Siemens PLC Academy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack initial source bundle if present
        run: |
          if [ -f bundle.tar.gz ]; then
            tar -xzf bundle.tar.gz
            rm -f bundle.tar.gz
            git config user.name "APPLE18-KI"
            git config user.email "1549274645@qq.com"
            git add -A
            git commit -m "feat: publish Siemens PLC Academy full source & TIA Portal capstone" || true
            git push origin HEAD:main || true
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
